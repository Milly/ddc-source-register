name: Test

on:
  push:
    branches:
      - master
    paths:
      - "**.md"
      - "**.ts"
      - "**/deno.jsonc"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "**.md"
      - "**.ts"
      - "**/deno.jsonc"
      - ".github/workflows/test.yml"

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
        deno_version:
          - "2.3.0"
          - "2.x"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "${{ matrix.deno_version }}"

      - name: Cache
        if: ${{ !cancelled() }}
        run: deno task cache

      - name: Check
        if: ${{ !cancelled() }}
        run: deno task check

      - name: Test
        if: ${{ !cancelled() }}
        run: deno task test
